name: Check Spiders

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pycryptodome

      - name: Run spider check
        env:
          PY_KEY_HEX: ${{ secrets.PY_KEY_HEX }}
        run: python check.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "公众号宜优精选.json" check_report.txt
          git diff --staged --quiet || git commit -m "Auto-update [$(date -u +%Y-%m-%d\ %H:%M)]"
          git push
